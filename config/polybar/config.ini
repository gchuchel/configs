[colors]
background = #000000
background-alt = #1a1a1a
foreground = #aaaaaa
primary = #ffffff
secondary = #888888
alert = #ff4444
disabled = #555555

[bar/example]
width = 100%
height = 14pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 0pt
border-size = 0pt
border-color = #00000000

padding-left = 0
padding-right = 1
module-margin = 1

separator =
separator-foreground = ${colors.disabled}

font-0 = monospace;2

modules-left = xworkspaces xwindow
modules-right = temperature filesystem pulseaudio xkeyboard memory cpu battery bluetooth wlan eth date weather mpd mpdinfo

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/systray]
type = internal/tray
format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline = ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 80
format = <label>
format-warn = <label-warn>
label = TEMP %temperature-c%
label-warn = TEMP %temperature-c%
label-warn-foreground = ${colors.alert}

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
label-mounted = %{F#ffffff}%mountpoint%%{F-} %free%
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "V:"
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.alert}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%
label-layout-foreground = ${colors.primary}
label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "R:"
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "C:"
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/battery]
type = internal/battery
full-at = 99
battery = BAT0
adapter = AC
poll-interval = 5
format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
label-charging = B:%percentage%%
label-discharging = B:%percentage%%
label-full = B:FULL

[module/bluetooth]
type = custom/script
exec = if systemctl is-active bluetooth | grep -q "^active$"; then echo "BT:on"; else echo "BT:off"; fi
interval = 5
label = %output%
click-left = blueman-manager

[network-base]
type = internal/network
interval = 1
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#ffffff}%ifname%%{F#555555} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#ffffff}%ifname%%{F-} %essid% %local_ip% v%downspeed:3% ^%upspeed:3%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#ffffff}%ifname%%{F-} %local_ip% v%downspeed:3% ^%upspeed:3%

[module/date]
type = internal/date
interval = 1
date = %d.%m.%Y %H:%M
date-alt = %A, %d %B %Y %H:%M:%S
label = %date%
label-foreground = ${colors.primary}

[module/weather]
type = custom/script
exec = curl -s 'wttr.in/?format=%t'
interval = 60
format-prefix = "W:"
format-prefix-foreground = ${colors.primary}
label = %output%
click-left = ~/.scripts/app/weather

[module/mpd]
type = internal/mpd
host = 127.0.0.1
port = 6600
interval = 2
format-online = <icon-prev> <toggle> <icon-next>
format-offline = + MPD off
icon-play = -
icon-pause = +
icon-prev = <
icon-next = >

[module/mpdinfo]
type = custom/text
format = ?
click-left = alacritty --class mpdplayer -e ncmpcpp

[settings]
screenchange-reload = true
pseudo-transparency = true
